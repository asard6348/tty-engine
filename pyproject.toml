[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ttyengine"
version = "0.1.0"
description = "A terminal rendering, physics and sound engine"
readme = "README.md"
requires-python = ">=3.8"
license = "MPL-2.0"
license-files = ["LICENSE", "ttyengine/figlet-LICENSE.txt"]
dependencies = []
keywords = ["terminal", "tty", "cli", "ascii", "engine", "simulation", "game", "physics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Terminals",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
keyboard = ["keyboard"]
ffmpeg = ["imageio-ffmpeg"]

[project.urls]
Homepage = "https://github.com/asard6348/tty-engine"
Source = "https://github.com/asard6348/tty-engine"
Issues = "https://github.com/asard6348/tty-engine/issues"
Changelog = "https://github.com/asard6348/tty-engine/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["ttyengine*"]

[tool.setuptools.package-data]
ttyengine = ["fonts.zip", "figlet-LICENSE.txt"]
