[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ttyengine"
version = "0.1.0"
description = "A terminal rendering, physics and sound engine"
readme = "README.md"
requires-python = ">=3.7"
dependencies = []
keywords = ["terminal", "tty", "cli", "ascii", "engine", "simulation", "game", "physics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries",
]
license = "MPL 2.0"
license-files = ["LICENSE"]

[project.optional-dependencies]
keyboard = ["keyboard"]
ffmpeg = ["imageio-ffmpeg"]

[project.urls]
Homepage = "https://github.com/asard6348/tty-engine"
Issues = "https://github.com/asard6348/tty-engine/issues"

[tool.setuptools.packages.find]
include = ["ttyengine*"]

[tool.setuptools.package-data]
ttyengine = ["fonts.zip", "figlet-LICENSE.txt"]
