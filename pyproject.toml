[build-system]
requires = ["setuptools>=61", "setuptools-rust>=1.5"]
build-backend = "setuptools.build_meta"

[project]
name = "ttyengine"
version = "0.2.4"
description = "A terminal rendering, physics and sound engine"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []
keywords = ["terminal", "tty", "cli", "ascii", "engine", "simulation", "game", "physics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Terminals",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
keyboard = ["keyboard"]
ffmpeg = ["imageio-ffmpeg"]

[project.urls]
Homepage = "https://github.com/asard6348/tty-engine"
Source = "https://github.com/asard6348/tty-engine"
Issues = "https://github.com/asard6348/tty-engine/issues"
Changelog = "https://github.com/asard6348/tty-engine/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["ttyengine*"]

[tool.setuptools.package-data]
ttyengine = ["fonts.zip", "figlet-LICENSE.txt"]

[[tool.setuptools-rust.ext-modules]]
target = "ttyengine._native"
path = "native/Cargo.toml"
binding = "PyO3"
optional = true

[tool.distutils.bdist_wheel]
py-limited-api = "cp38"

[tool.cibuildwheel]
build = "cp39-*"
test-command = "python -m unittest discover -s {project}/tests"

[tool.cibuildwheel.linux]
archs = ["native"]
before-all = "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$PATH:$HOME/.cargo/bin" }

[tool.cibuildwheel.macos]
archs = ["native"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
