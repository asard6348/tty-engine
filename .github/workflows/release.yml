name: Release

on:
  push:
    tags:
      - "*"

jobs:
  tests:
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, sys, tomllib
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          tag = os.environ["TAG"]
          if tag.removeprefix("v") != version:
              sys.exit(f"tag {tag!r} does not match the version {version!r} in pyproject.toml")
          PY

      - run: python -m pip install . build twine
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ttyengine/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -f CHANGELOG.md ]; then
            notes=(--notes-file CHANGELOG.md)
          else
            notes=(--notes "")
          fi
          gh release create "$TAG" --draft --verify-tag --title "$TAG" "${notes[@]}" dist/*
